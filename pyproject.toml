[project]
name = "comment-to-brief"
version = "0.1.0"
description = "Turn a video's comment section into a ranked, evidence-backed idea brief."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "youtube-comment-downloader>=0.1.75",
    "scikit-learn>=1.4",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
